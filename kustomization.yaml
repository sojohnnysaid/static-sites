apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: static-sites

resources:
  - k8s/product/deployment.yaml
  - k8s/product/service.yaml
  - k8s/solutions/deployment.yaml
  - k8s/solutions/service.yaml
  - k8s/hello-world/deployment.yaml
  - k8s/hello-world/service.yaml
  - k8s/diagram/deployment.yaml
  - k8s/diagram/service.yaml
  - k8s/kalshi-btc/deployment.yaml
  - k8s/kalshi-btc/service.yaml
  - k8s/test-site/deployment.yaml
  - k8s/test-site/service.yaml
  - k8s/gardening/deployment.yaml
  - k8s/gardening/service.yaml
  - k8s/networkpolicy.yaml

configMapGenerator:
  - name: product-html
    files:
      - index.html=sites/product/index.html
  - name: solutions-html
    files:
      - index.html=sites/solutions/index.html
  - name: hello-world-html
    files:
      - index.html=sites/hello-world/index.html
  - name: diagram-html
    files:
      - index.html=sites/diagram/index.html
  - name: kalshi-btc-html
    files:
      - index.html=sites/kalshi-btc/index.html
  - name: test-site-html
    files:
      - index.html=sites/test-site/index.html
  - name: gardening-html
    files:
      - index.html=sites/gardening-sogo-io/index.html

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: static-sites
    includeSelectors: true
