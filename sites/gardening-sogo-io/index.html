  // ============================================================
  // STATE
  // ============================================================
  const STORAGE_KEY = 'gardening-wizard-answers';
  let state = loadState();

  function defaultState() {
    return { step: 0, answers: { climate: null, sunlight: null, space: null, water: null, goals: [] } };
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch(e) {}
    return defaultState();
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function restartWizard() {
    state = defaultState();
    saveState();
    render();
  }

  // ============================================================
  // SCORING
  // ============================================================
  function scorePlants(answers) {
    return PLANTS
      .filter(p => p.climate.includes(answers.climate))
      .map(p => {
        let score = 0;
        if (p.sunlight.includes(answers.sunlight)) score += 2;
        if (p.space.includes(answers.space)) score += 2;
        if (p.water.includes(answers.water)) score += 1;
        const matchedGoals = answers.goals.filter(g => p.goals.includes(g));
        score += matchedGoals.length * 2;
        return { ...p, score, matchedGoals };
      })
      .sort((a, b) => b.score - a.score);
  }

  function matchLabel(score) {
    if (score >= 9) return { text: 'Perfect Match', emoji: '✨', color: 'bg-garden-100 text-garden-800' };
    if (score >= 6) return { text: 'Great Match', emoji: '🌟', color: 'bg-emerald-100 text-emerald-800' };
    if (score >= 3) return { text: 'Good Match', emoji: '👍', color: 'bg-amber-100 text-amber-800' };
    return { text: 'Worth Considering', emoji: '🤔', color: 'bg-stone-100 text-stone-600' };
  }

  function difficultyBadge(d) {
    if (d === 'beginner') return { text: 'Beginner-friendly', color: 'bg-green-100 text-green-700' };
    if (d === 'intermediate') return { text: 'Intermediate', color: 'bg-amber-100 text-amber-700' };
    return { text: 'Advanced', color: 'bg-red-100 text-red-700' };
  }

  // ============================================================
  // RENDERING
  // ============================================================
  function render() {
    const app = document.getElementById('app');
    const progressSection = document.getElementById('progress-section');
    const restartBtn = document.getElementById('restart-btn');

    if (state.step === 'results') {
      progressSection.classList.add('hidden');
      restartBtn.classList.remove('hidden');
      renderResults(app);
    } else if (state.step === 'welcome') {
      progressSection.classList.add('hidden');
      restartBtn.classList.add('hidden');
      renderWelcome(app);
    } else {
      progressSection.classList.remove('hidden');
      restartBtn.classList.remove('hidden');
      renderStep(app, state.step);
      updateProgress(state.step);
    }
    saveState();
  }

  function updateProgress(stepIdx) {
    const total = STEPS.length;
    const pct = ((stepIdx + 1) / total) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('step-label').textContent = `Step ${stepIdx + 1} of ${total}`;

    const indicators = document.getElementById('step-indicators');
    indicators.innerHTML = STEPS.map((s, i) => {
      const done = i < stepIdx;
      const active = i === stepIdx;
      let cls = 'w-8 h-2 rounded-full transition-all duration-300 ';
      if (done) cls += 'bg-garden-500';
      else if (active) cls += 'bg-garden-400';
      else cls += 'bg-garden-200';
      return `<div class="${cls}"></div>`;
    }).join('');
  }

          Answer a few quick questions about your garden, and we'll recommend herbs, flowers, and edibles that'll thrive in your space.

        <button onclick="state.step = 0; render()" class="inline-flex items-center gap-2 rounded-xl bg-garden-600 hover:bg-garden-700 px-8 py-4 font-semibold text-white text-lg shadow-lg shadow-garden-200 transition-all hover:shadow-xl hover:shadow-garden-200">

  function renderStep(app, stepIdx) {

        </div>
        <div class="grid gap-3 ${step.options.length <= 3 ? '' : 'sm:grid-cols-2'}">
          ${step.options.map(opt => {
            const selected = isMulti
              ? (currentVal || []).includes(opt.value)
              : currentVal === opt.value;
            return `
              <button onclick="selectOption('${step.id}', '${opt.value}', ${isMulti})"
                class="relative flex items-start gap-4 rounded-2xl border-2 p-4 text-left transition-all duration-200
                  ${selected
                    ? 'border-garden-500 bg-garden-50 shadow-md'
                    : 'border-stone-200 bg-white hover:border-garden-300 hover:shadow-md'}">
                ${selected ? '<div class="card-check absolute top-3 right-3 w-6 h-6 rounded-full bg-garden-500 flex items-center justify-center"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>' : ''}
                <span class="text-3xl flex-shrink-0 mt-0.5">${opt.emoji}</span>
                <div>
                  <div class="font-semibold text-stone-900">${opt.label}</div>
                  <div class="text-sm text-stone-500">${opt.desc}</div>
                </div>
              </button>`;
          }).join('')}
        </div>
        <div class="flex items-center justify-between mt-8">
          ${stepIdx > 0
            ? `<button onclick="goBack()" class="rounded-xl border border-stone-300 bg-white px-6 py-3 font-semibold text-stone-700 hover:bg-stone-50 transition-colors">Back</button>`
            : '<div></div>'}
          <button onclick="goNext()" ${!hasSelection ? 'disabled' : ''}
            class="rounded-xl px-6 py-3 font-semibold text-white transition-all
              ${hasSelection ? 'bg-garden-600 hover:bg-garden-700 shadow-lg shadow-garden-200' : 'bg-garden-600/40 cursor-not-allowed'}">
            ${stepIdx === STEPS.length - 1 ? 'See My Plants 🌿' : 'Next'}
          </button>
        </div>
      </div>`;
  }

  function selectOption(stepId, value, isMulti) {
    if (isMulti) {
      if (!state.answers[stepId]) state.answers[stepId] = [];
      const idx = state.answers[stepId].indexOf(value);
      if (idx >= 0) state.answers[stepId].splice(idx, 1);
      else state.answers[stepId].push(value);
    } else {
      state.answers[stepId] = value;
    }
    render();
  }

  function goBack() {
    if (state.step > 0) { state.step--; render(); }
  }

  function goNext() {
    const step = STEPS[state.step];
    const val = state.answers[step.id];
    const hasSelection = step.type === 'multi' ? (val && val.length > 0) : val !== null;
    if (!hasSelection) return;
    if (state.step < STEPS.length - 1) {
      state.step++;
    } else {
      state.step = 'results';
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderResults(app) {
    const answers = state.answers;
    const results = scorePlants(answers);

    // Build answer label map
    const labelMap = {};
    STEPS.forEach(s => s.options.forEach(o => { labelMap[o.value] = o.emoji + ' ' + o.label; }));

    const allSelected = [answers.climate, answers.sunlight, answers.space, answers.water, ...(answers.goals || [])];
    const pills = allSelected.filter(Boolean).map(v => `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-garden-100 text-garden-800 text-sm font-medium">${labelMap[v] || v}</span>`).join('');

    const climateLabel = STEPS[0].options.find(o => o.value === answers.climate)?.label || answers.climate;

    app.innerHTML = `
      <div class="fade-in">
        <div class="text-center mb-8">
          <div class="text-5xl mb-4">🌿</div>
          <h2 class="text-2xl md:text-3xl font-bold text-stone-900 mb-2">Your Plant Recommendations</h2>
          <p class="text-stone-500">We found <strong class="text-garden-700">${results.length} plant${results.length !== 1 ? 's' : ''}</strong> suited to your ${climateLabel.toLowerCase()} climate</p>
        </div>
        <div class="flex flex-wrap gap-2 justify-center mb-8">${pills}</div>
        <div class="space-y-4">
          ${results.map(p => renderPlantCard(p, answers)).join('')}
        </div>
        <div class="text-center mt-12 mb-8 p-8 rounded-2xl bg-white border border-garden-200">
          <div class="text-4xl mb-3">🌻</div>
          <h3 class="text-xl font-bold text-stone-900 mb-2">Ready to get growing?</h3>
          <p class="text-stone-500 mb-6">Save this page, take it to your local nursery, and start your garden adventure!</p>
          <button onclick="restartWizard()" class="rounded-xl border border-stone-300 bg-white px-6 py-3 font-semibold text-stone-700 hover:bg-stone-50 transition-colors">
            Start a New Search
          </button>
        </div>
      </div>`;
  }

  function renderPlantCard(plant, answers) {
    const ml = matchLabel(plant.score);
    const db = difficultyBadge(plant.difficulty);

    // Sun/water labels
    const sunLabel = plant.sunlight.map(s => {
      if (s === 'full-sun') return '☀️ Full Sun';
      if (s === 'partial-sun') return '⛅ Partial';
      return '🌥️ Shade';
    }).join(', ');
    const waterLabel = plant.water.map(w => {
      if (w === 'regular') return '💧 Regular';
      if (w === 'occasionally') return '🚿 Occasional';
      return '🏜️ Low';
    }).join(', ');

    // Goal tags
    const goalLabelMap = { food: '🍽️ Food', flowers: '💐 Flowers', wildlife: '🐝 Wildlife', privacy: '🌲 Privacy', 'low-maintenance': '😌 Low-Maintenance' };
    const goalTags = plant.goals.map(g => {
      const isMatched = plant.matchedGoals.includes(g);
      return `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium ${isMatched ? 'bg-garden-100 text-garden-700 ring-1 ring-garden-300' : 'bg-stone-100 text-stone-500'}">${goalLabelMap[g] || g}</span>`;
    }).join(' ');

    // Why it matches
    const reasons = [];
    if (plant.sunlight.includes(answers.sunlight)) reasons.push('sun needs match');
    if (plant.space.includes(answers.space)) reasons.push('fits your space');
    if (plant.water.includes(answers.water)) reasons.push('suits your watering routine');
    if (plant.matchedGoals.length > 0) reasons.push(`matches ${plant.matchedGoals.length} of your goals`);
    const reasonText = reasons.length > 0
      ? reasons.map(r => r.charAt(0).toUpperCase() + r.slice(1)).join(' · ')
      : 'Grows well in your climate';

    return `
      <div class="rounded-2xl bg-white border border-stone-200 p-5 hover:shadow-md transition-shadow">
        <div class="flex items-start justify-between gap-3 mb-3">
          <div class="flex items-center gap-3">
            <span class="text-4xl">${plant.emoji}</span>
            <div>
              <h3 class="font-bold text-lg text-stone-900">${plant.name}</h3>
              <div class="flex flex-wrap gap-2 mt-1">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold ${ml.color}">${ml.emoji} ${ml.text}</span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${db.color}">${db.text}</span>
              </div>
            </div>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="text-xs text-stone-400 font-medium">Score</div>
            <div class="text-lg font-bold text-garden-700">${plant.score}</div>
          </div>
        </div>
        <p class="text-stone-600 text-sm leading-relaxed mb-3">${plant.description}</p>
        <p class="text-xs text-garden-600 font-medium mb-3">${reasonText}</p>
        <div class="flex flex-wrap gap-1.5 mb-3">${goalTags}</div>
        <div class="grid grid-cols-2 gap-2 text-xs text-stone-500 mb-3">
          <div><span class="font-medium text-stone-700">Sun:</span> ${sunLabel}</div>
          <div><span class="font-medium text-stone-700">Water:</span> ${waterLabel}</div>
          <div class="col-span-2"><span class="font-medium text-stone-700">Timeline:</span> ${plant.harvestTime}</div>
        </div>
        <div class="rounded-xl bg-amber-50 border border-amber-200 p-3">
          <p class="text-sm text-amber-800"><span class="font-semibold">💡 Pro tip:</span> ${plant.tip}</p>
        </div>
      </div>`;
  }

  // ============================================================
  // INIT
  // ============================================================
  // If user has completed answers, show results; if fresh, show step 0
  if (state.step === 'results') {
    // Validate we still have all answers
    if (!state.answers.climate || !state.answers.sunlight || !state.answers.space || !state.answers.water || !state.answers.goals?.length) {
      state = defaultState();
    }
  } else if (typeof state.step !== 'number' || state.step < 0 || state.step >= STEPS.length) {
    state.step = 0;
  }
  render();
  </script>
</body>
</html>
