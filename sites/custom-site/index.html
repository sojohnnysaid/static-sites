<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .table-container {
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      border: 1px solid #1e293b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
    }

    thead th {
      background: #334155;
      padding: 0.875rem 1.25rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      border-bottom: 2px solid #475569;
    }

    tbody td {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #334155;
    }

    .status {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status--active {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .status--pending {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
    }

    .status--inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    footer {
      margin-top: 2rem;
      color: #475569;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>Custom Site</h1>
  <p class="subtitle">Dashboard overview</p>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Value</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Alpha Service</td>
          <td>Infrastructure</td>
          <td>128</td>
          <td><span class="status status--active">Active</span></td>
        </tr>
        <tr>
          <td>Beta Pipeline</td>
          <td>Data</td>
          <td>64</td>
          <td><span class="status status--active">Active</span></td>
        </tr>
        <tr>
          <td>Gamma Worker</td>
          <td>Compute</td>
          <td>256</td>
          <td><span class="status status--pending">Pending</span></td>
        </tr>
        <tr>
          <td>Delta Cache</td>
          <td>Storage</td>
          <td>512</td>
          <td><span class="status status--active">Active</span></td>
        </tr>
        <tr>
          <td>Epsilon Monitor</td>
          <td>Observability</td>
          <td>32</td>
          <td><span class="status status--inactive">Inactive</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer>custom-site.sogos.io</footer>
</body>
</html>
