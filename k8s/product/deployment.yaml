apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
      - name: python-server
        image: python:3.11-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          cd /html
          python -m http.server 8080
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: html
          mountPath: /html
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
      volumes:
      - name: html
        configMap:
          name: product-html
      securityContext:
        seccompProfile:
          type: RuntimeDefault
