apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-site
  namespace: static-sites
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-site
  template:
    metadata:
      labels:
        app: custom-site
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
      volumes:
      - name: html
        configMap:
          name: custom-site-html
      securityContext:
        seccompProfile:
          type: RuntimeDefault
