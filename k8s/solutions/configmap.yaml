        <script>
            let currentSlide = 1;
            const slides = document.querySelectorAll('.slide');
            const totalSlides = slides.length;
            const logo = document.querySelector('.conga-logo');
            
            document.getElementById('totalSlides').textContent = totalSlides;
    
            function showSlide(n) {
                slides.forEach(slide => slide.classList.remove('active'));
                
                if (n > totalSlides) {
                    currentSlide = totalSlides;
                } else if (n < 1) {
                    currentSlide = 1;
                } else {
                    currentSlide = n;
                }
                
                slides[currentSlide - 1].classList.add('active');
                document.getElementById('currentSlide').textContent = currentSlide;
                
                document.getElementById('prevBtn').disabled = currentSlide === 1;
                document.getElementById('nextBtn').disabled = currentSlide === totalSlides;
                
                // Move logo to bottom right on title slides (slides 1 and 11)
                if (currentSlide === 1 || currentSlide === 11) {
                    logo.style.top = 'auto';
                    logo.style.bottom = '120px';
                    logo.style.right = '60px';
                } else {
                    logo.style.top = '30px';
                    logo.style.bottom = 'auto';
                    logo.style.right = '30px';
                }
            }
    
            function changeSlide(direction) {
                showSlide(currentSlide + direction);
            }
    
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') {
                    changeSlide(-1);
                } else if (e.key === 'ArrowRight') {
                    changeSlide(1);
                }
            });
    
            showSlide(1);
        </script>
