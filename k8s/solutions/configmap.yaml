apiVersion: v1
kind: ConfigMap
metadata:
  name: solutions-html
  namespace: static-sites
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Principal Solutions Architect - API & Integration Proposal</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            body {
                font-family: 'Montserrat', 'Buenos Aires', sans-serif;
                background: #F1F2F2;
                overflow: hidden;
            }
    
            .slideshow {
                width: 100vw;
                height: 100vh;
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
            }
    
            .slide-wrapper {
                width: 100%;
                max-width: 1400px;
                height: 100%;
                max-height: 900px;
                position: relative;
                margin: 0 auto;
            }
    
            .slide {
                width: 100%;
                height: calc(100% - 100px);
                display: none;
                padding: 60px 80px 40px 80px;
                background: white;
                position: relative;
                overflow-y: auto;
            }
    
            .slide.active {
                display: flex;
                flex-direction: column;
            }
    
            @media (max-width: 768px) {
                .slide {
                    height: calc(100% - 80px);
                    padding: 30px 20px 30px 20px;
                    max-height: none;
                    min-height: calc(100vh - 80px);
                }
            }
    
            .conga-red { color: #E53535; }
            .charcoal { color: #474542; }
            .blue-harbor-light { color: #E3F0F4; }
            .bg-red { background: #E53535; }
            .bg-light { background: #E3F0F4; }
            .bg-charcoal { background: #474542; }
    
            .title-slide {
                background: linear-gradient(135deg, #E53535 0%, #E53535 60%, #48A9C5 60%, #48A9C5 100%);
                justify-content: flex-start;
                align-items: flex-start;
                color: white;
                padding-top: 120px;
                padding-left: 100px;
            }
    
            .title-slide h1 {
                font-size: 72px;
                font-weight: 700;
                margin-bottom: 20px;
                line-height: 1.2;
                position: relative;
                z-index: 1;
            }
    
            .title-slide .subtitle {
                font-size: 32px;
                font-weight: 400;
                margin-bottom: 40px;
                position: relative;
                z-index: 1;
            }
    
            .title-slide .meta {
                font-size: 18px;
                opacity: 0.9;
                position: relative;
                z-index: 1;
            }
    
            @media (max-width: 768px) {
                .title-slide {
                    padding-top: 60px;
                    padding-left: 30px;
                }
    
                .title-slide h1 {
                    font-size: 42px;
                }
    
                .title-slide .subtitle {
                    font-size: 22px;
                }
    
                .title-slide .meta {
                    font-size: 16px;
                }
            }
    
            .slide-header {
                margin-bottom: 40px;
            }
    
            .slide-header h2 {
                font-size: 48px;
                font-weight: 700;
                color: #474542;
                margin-bottom: 10px;
            }
    
            .slide-header .section-tag {
                font-size: 14px;
                color: #E53535;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
            }
    
            @media (max-width: 768px) {
                .slide-header {
                    margin-bottom: 30px;
                }
    
                .slide-header h2 {
                    font-size: 32px;
                }
    
                .slide-header .section-tag {
                    font-size: 12px;
                }
            }
    
            .slide-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 30px;
            }
    
            .content-section {
                background: #F1F2F2;
                padding: 30px;
                border-radius: 8px;
            }
    
            .content-section h3 {
                font-size: 24px;
                font-weight: 700;
                color: #474542;
                margin-bottom: 15px;
            }
    
            .content-section p, .content-section li {
                font-size: 18px;
                line-height: 1.6;
                color: #474542;
            }
    
            .content-section ul {
                list-style: none;
                padding-left: 0;
            }
    
            .content-section li {
                padding-left: 25px;
                position: relative;
                margin-bottom: 10px;
            }
    
            .content-section li:before {
                content: "";
                position: absolute;
                left: 0;
                top: 10px;
                width: 8px;
                height: 8px;
                background: #E53535;
                border-radius: 50%;
            }
    
            @media (max-width: 768px) {
                .content-section {
                    padding: 20px;
                }
    
                .content-section h3 {
                    font-size: 20px;
                }
    
                .content-section p, .content-section li {
                    font-size: 15px;
                }
            }
    
            .two-column {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px;
            }
    
            @media (max-width: 768px) {
                .two-column {
                    grid-template-columns: 1fr;
                    gap: 20px;
                }
            }
    
            /* Value Proposition Boxes */
            .value-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
    
            .value-grid.asymmetric {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
                margin-bottom: 30px;
            }
    
            .value-grid.asymmetric-bottom {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
    
            .value-card {
                background: white;
                padding: 25px;
                border-radius: 8px;
                border-top: 4px solid #E53535;
                position: relative;
            }
    
            .value-card.large {
                padding: 35px 35px 35px 100px;
                min-height: 180px;
            }
    
            .value-card.small {
                padding: 25px 25px 25px 80px;
                min-height: 140px;
            }
    
            .value-card .card-number {
                position: absolute;
                top: 30px;
                left: 25px;
                font-size: 56px;
                font-weight: 700;
                color: #E53535;
                opacity: 0.3;
                line-height: 1;
            }
    
            .value-card.small .card-number {
                font-size: 42px;
                top: 25px;
                left: 20px;
            }
    
            .value-card h4 {
                font-size: 20px;
                font-weight: 700;
                color: #474542;
                margin-bottom: 12px;
                position: relative;
            }
    
            .value-card.large h4 {
                font-size: 24px;
            }
    
            .value-card p {
                font-size: 15px;
                color: #474542;
                line-height: 1.6;
                position: relative;
            }
    
            .value-card.large p {
                font-size: 16px;
            }
    
            .value-card ul {
                list-style: none;
                padding: 0;
            }
    
            .value-card li {
                padding-left: 20px;
                position: relative;
                margin-bottom: 8px;
                font-size: 16px;
            }
    
            .value-card li:before {
                content: "";
                position: absolute;
                left: 0;
                top: 8px;
                width: 6px;
                height: 6px;
                background: #48A9C5;
                border-radius: 50%;
            }
    
            .value-grid.three-col {
                grid-template-columns: repeat(3, 1fr);
            }
    
            .force-multiplier-banner {
                background: linear-gradient(135deg, #E53535 0%, #48A9C5 100%);
                padding: 35px 40px;
                border-radius: 8px;
                color: white;
                margin-top: 30px;
            }
    
            .force-multiplier-banner h3 {
                font-size: 28px;
                font-weight: 700;
                margin-bottom: 15px;
            }
    
            .force-multiplier-banner p {
                font-size: 17px;
                line-height: 1.6;
                opacity: 0.95;
            }
    
            @media (max-width: 768px) {
                .value-grid, .value-grid.asymmetric, .value-grid.asymmetric-bottom, .value-grid.three-col {
                    grid-template-columns: 1fr;
                    gap: 15px;
                }
    
                .value-card {
                    padding: 20px;
                }
    
                .value-card.large,
                .value-card.small {
                    padding: 25px 25px 25px 70px;
                    min-height: auto;
                }
    
                .value-card .card-number {
                    font-size: 42px;
                    top: 20px;
                    left: 15px;
                }
    
                .value-card.small .card-number {
                    font-size: 36px;
                }
    
                .value-card h4 {
                    font-size: 18px;
                }
    
                .value-card.large h4 {
                    font-size: 20px;
                }
    
                .value-card p {
                    font-size: 14px;
                }
    
                .value-card.large p {
                    font-size: 15px;
                }
    
                .force-multiplier-banner {
                    padding: 25px;
                }
    
                .force-multiplier-banner h3 {
                    font-size: 22px;
                }
    
                .force-multiplier-banner p {
                    font-size: 15px;
                }
            }
    
            .highlight-box {
                background: #48A9C5;
                color: white;
                padding: 30px;
                border-radius: 8px;
                margin-top: 20px;
            }
    
            .highlight-box h3 {
                font-size: 24px;
                font-weight: 700;
                margin-bottom: 15px;
                color: white;
            }
    
            .highlight-box p {
                font-size: 18px;
                line-height: 1.6;
                color: white;
            }
    
            /* Timeline */
            .timeline-item {
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
            }
    
            .timeline-marker {
                width: 40px;
                height: 40px;
                background: #E53535;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: 700;
                flex-shrink: 0;
            }
    
            .timeline-content {
                flex: 1;
                background: #F1F2F2;
                padding: 20px;
                border-radius: 8px;
            }
    
            .timeline-content h4 {
                font-size: 18px;
                font-weight: 700;
                color: #474542;
                margin-bottom: 8px;
            }
    
            .timeline-content p {
                font-size: 15px;
                color: #474542;
            }
    
            .question-item {
                background: #E3F0F4;
                padding: 20px 25px;
                border-radius: 8px;
                margin-bottom: 15px;
                font-size: 18px;
                color: #474542;
            }
    
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                margin-top: 30px;
            }
    
            @media (max-width: 768px) {
                .stats-grid {
                    grid-template-columns: 1fr;
                }
            }
    
            .stat-card {
                background: white;
                border: 2px solid #48A9C5;
                padding: 25px;
                border-radius: 8px;
                text-align: center;
            }
    
            .stat-number {
                font-size: 42px;
                font-weight: 700;
                color: #48A9C5;
                margin-bottom: 10px;
            }
    
            .stat-label {
                font-size: 16px;
                color: #474542;
                font-weight: 600;
            }
    
            .impact-card {
                background: linear-gradient(135deg, #48A9C5 0%, #48A9C5 70%, white 70%);
                padding: 30px;
                border-radius: 8px;
                color: white;
                margin-bottom: 20px;
            }
    
            .impact-card h4 {
                font-size: 22px;
                font-weight: 700;
                margin-bottom: 12px;
                color: white;
            }
    
            .impact-card p {
                font-size: 16px;
                line-height: 1.6;
                color: white;
            }
    
            .nav-wrapper {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 100px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 30px;
                background: white;
                border-top: 1px solid #F1F2F2;
                z-index: 1000;
            }
    
            @media (max-width: 768px) {
                .nav-wrapper {
                    height: 80px;
                    padding: 0 15px;
                }
    
                .nav-controls {
                    gap: 10px;
                }
    
                .nav-btn {
                    padding: 12px 20px;
                    font-size: 14px;
                }
    
                .slide-counter {
                    font-size: 14px;
                }
    
                .conga-logo {
                    width: 50px;
                    height: 50px;
                    top: 20px;
                    right: 15px;
                }
            }
    
            .nav-controls {
                display: flex;
                gap: 15px;
            }
    
            .nav-btn {
                background: #E53535;
                color: white;
                border: none;
                padding: 15px 30px;
                border-radius: 50px;
                font-size: 18px;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.3s;
                font-family: 'Montserrat', sans-serif;
            }
    
            .nav-btn:hover:not(:disabled) {
                background: #c42d2d;
                transform: translateY(-2px);
            }
    
            .nav-btn:disabled {
                background: #BBBCBC;
                cursor: not-allowed;
                transform: none;
            }
    
            .conga-logo {
                position: absolute;
                top: 30px;
                right: 30px;
                width: 80px;
                height: 80px;
                z-index: 999;
            }
    
            .conga-logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
    
            .skill-badges {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                margin-top: 20px;
            }
    
            .skill-badge {
                background: white;
                border: 2px solid #48A9C5;
                padding: 8px 16px;
                border-radius: 20px;
                font-size: 14px;
                font-weight: 600;
                color: #48A9C5;
            }
        </style>
    </head>
    <body>
        <div class="slideshow">
            <div class="slide-wrapper">
    
            <!-- Slide 1: Title -->
            <div class="slide title-slide active">
                <h1>Principal Solutions<br>Architect<br>API & Integration</h1>
                <div class="subtitle">Enabling field excellence through deep technical expertise</div>
                <div class="meta">October 23, 2025 | John Yzaguirre</div>
            </div>
    
            <!-- Slide 2: The Field Challenge -->
            <div class="slide">
                <div class="slide-header">
                    <div class="section-tag">CURRENT STATE</div>
                    <h2>Challenges facing your SA team</h2>
                </div>
                <div class="slide-content">
                    <div class="value-grid three-col">
                        <div class="content-section">
                            <h3>Complex API deals</h3>
                            <p>Enterprise opportunities requiring deep Revenue Lifecycle API expertise that goes beyond typical SA knowledge</p>
                        </div>
                        <div class="content-section">
                            <h3>Integration complexity</h3>
                            <p>Multi-product flows (CPQ → CLM → Sign → DocGen) with intricate orchestration patterns and custom requirements</p>
                        </div>
                        <div class="content-section">
                            <h3>Enablement gaps</h3>
                            <p>Limited resources to train SAs on advanced API patterns, best practices, and emerging integration techniques</p>
                        </div>
                    </div>
                    <div class="content-section">
                        <h3>The impact on your team</h3>
                        <p>SAs spending time researching instead of selling. Deals delayed by technical uncertainty. Lost opportunities where API expertise could differentiate. Partner ecosystem underutilized because of limited enablement resources.</p>
                    </div>
                </div>
            </div>
    
            <!-- Slide 3: My Background -->
            <div class="slide">
                <div class="slide-header">
                    <div class="section-tag">RELEVANT EXPERIENCE</div>
                    <h2>Why I'm positioned to help</h2>
                </div>
                <div class="slide-content">
                    <div class="content-section">
                        <h3>Deep Revenue Lifecycle API expertise</h3>
                        <p>2+ years as Senior API Curriculum Developer and SME for Conga Advantage Platform APIs. I've documented, taught, and troubleshot every major integration pattern.</p>
                    </div>
                    <div class="two-column">
                        <div class="content-section">
                            <h3>Enablement at scale</h3>
                            <ul>
                                <li>Built comprehensive API curriculum from ground up</li>
                                <li>Created learning paths for different personas</li>
                                <li>Developed hands-on labs and certification content</li>
                                <li>Comfortable presenting to technical and business audiences</li>
                            </ul>
                        </div>
                        <div class="content-section">
                            <h3>Technical depth meets communication</h3>
                            <ul>
                                <li>Hands-on with Playwright for E2E testing</li>
                                <li>CI/CD pipeline integration experience</li>
                                <li>Can translate complex technical concepts clearly</li>
                                <li>Bridge between engineering reality and customer needs</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
    
            <!-- Slide 4: The Proposed Role -->
            <div class="slide">
                <div class="slide-header">
                    <div class="section-tag">ROLE DEFINITION</div>
                    <h2>Principal Solutions Architect<br>API & Integration</h2>
                </div>
                <div class="slide-content">
                    <div class="content-section">
                        <h3>Primary reporting: Product with dotted line to your organization</h3>
                        <p>I stay funded by Product while being aligned to support your team's strategic needs. The 60/40 split ensures Product gets productization and testing work, while you get specialized technical support and enablement.</p>
                    </div>
                    <div class="content-section">
                        <h3>Geographic advantage: EST timezone for EMEA and West Coast support</h3>
                        <p>My EST location enables me to effectively support Solutions Architects on the West Coast and uplevel EMEA countries with better timezone coverage for international customer engagements and team collaboration.</p>
                    </div>
                    <div class="two-column">
                        <div class="value-card">
                            <h4>Product-facing work</h4>
                            <ul>
                                <li>Productize integration patterns into reusable solutions</li>
                                <li>Build E2E testing frameworks for API journeys</li>
                                <li>Create reference architectures with working code</li>
                                <li>Translate field feedback into product requirements</li>
                            </ul>
                        </div>
                        <div class="value-card">
                            <h4>Supporting your team</h4>
                            <ul>
                                <li>Strategic deal support requiring API expertise</li>
                                <li>SA team enablement on advanced patterns</li>
                                <li>Partner ecosystem certification programs</li>
                                <li>Technical architecture workshops for customers</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
    
            <!-- Slide 5: What You Get -->
            <div class="slide">
                <div class="slide-header">
                    <div class="section-tag">VALUE TO SALES ENGINEERING</div>
                    <h2>How this helps your organization</h2>
                </div>
                <div class="slide-content">
                    <div class="value-grid asymmetric">
                        <div class="value-card large">
                            <div class="card-number">01</div>
                            <h4>Specialized technical horsepower</h4>
                            <p>Deep-dive on enterprise opportunities requiring sophisticated API architecture. Your SAs get an escalation expert they can pull in when deals need it.</p>
                        </div>
                        <div class="value-card large">
                            <div class="card-number">02</div>
                            <h4>SA team capability expansion</h4>
                            <p>Regular training on integration patterns. Office hours for technical questions. Enablement content that scales your team's knowledge.</p>
                        </div>
                    </div>
                    <div class="value-grid asymmetric-bottom">
                        <div class="value-card small">
                            <div class="card-number">03</div>
                            <h4>Partner ecosystem development</h4>
                            <p>Build certification programs for SI partners. Technical enablement for ISVs. Community building around Revenue Lifecycle APIs.</p>
                        </div>
                        <div class="value-card small">
                            <div class="card-number">04</div>
                            <h4>Zero impact to your budget</h4>
                            <p>I'm funded through Product organization. You get specialized support without headcount expense.</p>
                        </div>
                    </div>
                    <div class="force-multiplier-banner">
                        <h3>The competitive advantage</h3>
                        <p>Technical depth becomes a deal differentiator. Customers see Conga as having serious API expertise, not just features. Your team closes more complex opportunities with higher ASP because they have the technical credibility and support to win.</p>
                    </div>
                </div>
            </div>
    
            <!-- Slide 6: Success Metrics -->
            <div class="slide">
                <div class="slide-header">
                    <div class="section-tag">FIELD SUCCESS METRICS</div>
                    <h2>Q1 FY2026 goals (Jan-Mar 2026)</h2>
                </div>
                <div class="slide-content">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">3+</div>
                            <div class="stat-label">Strategic deals supported with deep API expertise</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">100%</div>
                            <div class="stat-label">SA team trained on advanced API patterns</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">80%+</div>
                            <div class="stat-label">Technical win rate on supported opportunities</div>
                        </div>
                    </div>
                    <div class="content-section" style="margin-top: 30px;">
                        <h3>Specific Q1 deliverables supporting your team</h3>
                        <ul>
                            <li><strong>Deal support:</strong> Embed in 3+ strategic opportunities requiring complex Revenue Lifecycle API architecture</li>
                            <li><strong>Enablement program:</strong> Deliver comprehensive SA training on CPQ-CLM-Sign-DocGen integration patterns</li>
                            <li><strong>Enablement materials:</strong> Create reusable demo environments, solution briefs, and technical playbooks SAs can leverage</li>
                            <li><strong>Office hours:</strong> Weekly technical Q&A sessions for SAs working API-heavy deals</li>
                            <li><strong>Partner kickoff:</strong> Initiate certification program with 2 key SI partners</li>
                        </ul>
                    </div>
                </div>
            </div>
    
            <!-- Slide 7: 6-Month Vision -->
            <div class="slide">
                <div class="slide-header">
                    <div class="section-tag">LOOKING AHEAD</div>
                    <h2>Vision through June 2026</h2>
                </div>
                <div class="slide-content">
                    <div class="timeline-item">
                        <div class="timeline-marker">Q2</div>
                        <div class="timeline-content">
                            <h4>April - June 2026</h4>
                            <p><strong>Scale the impact:</strong> Expanded partner certifications (3+ SI partners), advanced enablement content library, SA community of practice established, proven track record of technical wins in complex deals</p>
                        </div>
                    </div>
                    <div class="two-column">
                        <div class="content-section">
                            <h3>Measurable outcomes for your org</h3>
                            <ul>
                                <li>3+ strategic deals supported with documented win contributions</li>
                                <li>Reduced SA ramp time on API-heavy opportunities</li>
                                <li>Partner-delivered implementations increase</li>
                                <li>Customer implementation time reduced in comparison to previous year</li>
                            </ul>
                        </div>
                        <div class="content-section">
                            <h3>Expanded capabilities</h3>
                            <ul>
                                <li>Thought leadership: webinars, conference talks</li>
                                <li>Executive briefing program for enterprise accounts</li>
                                <li>Developer community engagement</li>
                                <li>Technical advisory for product roadmap</li>
                            </ul>
                        </div>
                    </div>
                    <div class="highlight-box">
                        <h3>Building a center of excellence</h3>
                        <p>By mid-2026, we establish Conga as having best-in-class Revenue Lifecycle API expertise. Your SAs are confident, partners are enabled, customers see us as technical leaders, and complex deals close faster because we have the architecture expertise to back it up.</p>
                    </div>
                </div>
            </div>
    
            <!-- Slide 8: Working Together -->
            <div class="slide">
                <div class="slide-header">
                    <div class="section-tag">COLLABORATION MODEL</div>
