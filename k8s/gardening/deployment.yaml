apiVersion: apps/v1
kind: Deployment
metadata:
  name: gardening
  namespace: static-sites
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gardening
  template:
    metadata:
      labels:
        app: gardening
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: extract-build
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - tar xzf /config/build.tar.gz -C /html
        volumeMounts:
        - name: build-archive
          mountPath: /config
          readOnly: true
        - name: html
          mountPath: /html
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: build-archive
        configMap:
          name: gardening-html
      - name: nginx-conf
        configMap:
          name: gardening-nginx-conf
      - name: html
        emptyDir: {}
