apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-html
  namespace: static-sites
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Hello Kubernetes</title>
      <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: 'Inter', sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
          min-height: 100vh;
          padding: 40px 20px;
          position: relative;
          overflow-x: hidden;
        }
        body::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-image:
            radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
          background-size: 40px 40px;
          pointer-events: none;
        }
        .container {
          max-width: 1400px;
          margin: 0 auto;
        }
        .header {
          text-align: center;
          margin-bottom: 50px;
        }
        .title {
          color: #f8fafc;
          font-size: 3rem;
          font-weight: 700;
          letter-spacing: -0.02em;
          margin-bottom: 12px;
          opacity: 0;
        }
        .subtitle {
          color: #60a5fa;
          font-size: 1.1rem;
          font-weight: 400;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          opacity: 0;
        }
        .diagram {
          position: relative;
          width: 100%;
          min-height: 800px;
        }
        .layer {
          display: flex;
          justify-content: center;
          gap: 30px;
          margin-bottom: 20px;
          flex-wrap: wrap;
          opacity: 0;
        }
        .connector {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          width: 4px;
          background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
          border-radius: 2px;
          opacity: 0;
        }
        .connector-1 { top: 180px; height: 60px; }
        .connector-2 { top: 340px; height: 60px; }
        .connector-3 { top: 560px; height: 60px; }
        .node {
          background: linear-gradient(145deg, rgba(30,58,95,0.9) 0%, rgba(15,23,42,0.95) 100%);
          border: 2px solid #3b82f6;
          border-radius: 16px;
          padding: 24px;
          min-width: 200px;
          text-align: center;
          cursor: pointer;
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
        }
        .node::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background: linear-gradient(145deg, rgba(59,130,246,0.1) 0%, transparent 50%);
          opacity: 0;
          transition: opacity 0.3s ease;
        }
        .node:hover {
          transform: translateY(-5px) scale(1.02);
          border-color: #60a5fa;
          box-shadow: 0 20px 40px rgba(59,130,246,0.3), 0 0 60px rgba(59,130,246,0.1);
        }
        .node:hover::before { opacity: 1; }
        .node-icon {
          width: 64px;
          height: 64px;
          margin: 0 auto 16px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .node-icon img, .node-icon svg {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
        .node-title {
          color: #f8fafc;
          font-size: 1.1rem;
          font-weight: 600;
          margin-bottom: 6px;
        }
        .node-subtitle {
          color: #94a3b8;
          font-size: 0.85rem;
        }
        .node-small {
          min-width: 160px;
          padding: 18px;
        }
        .node-small .node-icon {
          width: 48px;
          height: 48px;
          margin-bottom: 12px;
        }
        .node-small .node-title {
          font-size: 0.95rem;
        }
        .nodes-row {
          display: flex;
          justify-content: center;
          gap: 24px;
          flex-wrap: wrap;
        }
        .mac-node {
          background: linear-gradient(145deg, rgba(30,41,59,0.95) 0%, rgba(15,23,42,0.98) 100%);
          border-color: #22d3ee;
        }
        .mac-node:hover {
          border-color: #67e8f9;
          box-shadow: 0 20px 40px rgba(34,211,238,0.2), 0 0 60px rgba(34,211,238,0.1);
        }
        .footer {
          text-align: center;
          margin-top: 50px;
          color: #475569;
          font-size: 0.8rem;
          opacity: 0;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="header">
          <h1 class="title">Hello Kubernetes</h1>
          <p class="subtitle">Talos Linux Homelab Architecture</p>
        </div>

        <div class="diagram">
          <div class="connector connector-1"></div>
          <div class="connector connector-2"></div>
          <div class="connector connector-3"></div>

          <!-- Layer 1: Cloudflare -->
          <div class="layer" data-layer="1">
            <div class="node">
              <div class="node-icon">
                <svg viewBox="0 0 128 128" fill="#f38020">
                  <path d="M102.4 70.4c-.4-1.2-1.2-2-2.4-2.4l-8.8-2c-.8-.4-1.2-.8-1.2-1.6s.4-1.2.8-1.6c1.2-1.2 2-2.8 2-4.4 0-4-3.6-7.2-8-7.2-1.2 0-2.4.4-3.6.8-.8.4-1.6.4-2 0s-.8-1.2-.4-2c2-4.8 1.2-10.4-2.4-14.4-3.6-4-9.2-5.6-14.4-4-4.8 1.6-8.4 5.6-9.6 10.4-.4 1.2-1.2 2-2.4 2-5.6.4-10.4 4-12 9.2-1.6 5.2 0 11.2 4 14.8.8.8 1.2 2 .8 3.2-.4.8-1.2 1.6-2.4 1.6H28c-1.6 0-2.8 1.2-2.8 2.8s1.2 2.8 2.8 2.8h73.6c1.6 0 2.8-1.2 2.8-2.8.4-1.2-.4-2.4-2-3.2z"/>
                  <path d="M91.2 76H36.8c-1.2 0-2 .8-2 2s.8 2 2 2h54.4c1.2 0 2-.8 2-2s-.8-2-2-2z" fill-opacity=".5"/>
                </svg>
              </div>
              <div class="node-title">Cloudflare Tunnel</div>
              <div class="node-subtitle">*.sogos.io</div>
            </div>
          </div>

          <!-- Layer 2: Ingress -->
          <div class="layer" data-layer="2">
            <div class="node">
              <div class="node-icon">
                <svg viewBox="0 0 24 24" fill="#60a5fa">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
              </div>
              <div class="node-title">Ingress Namespace</div>
              <div class="node-subtitle">cloudflared (3 replicas)</div>
            </div>
          </div>

          <!-- Layer 3: Control Plane -->
          <div class="layer" data-layer="3">
            <div class="node" style="min-width: 500px;">
              <div class="node-icon">
                <svg viewBox="0 0 128 128" fill="#326ce5">
                  <path d="M64 1.67c-1.767 0-3.467.267-5.1.8L19.167 17.9c-3.267 1.1-5.867 3.7-6.967 7L.167 64.633c-.533 1.634-.8 3.334-.8 5.034 0 1.7.267 3.4.8 5.033l12.033 39.733c1.1 3.3 3.7 5.9 7 7l39.733 15.4c1.634.534 3.334.8 5.034.8 1.7 0 3.4-.266 5.033-.8l39.733-15.4c3.3-1.1 5.9-3.7 7-7l15.4-39.733c.534-1.633.8-3.333.8-5.033 0-1.7-.266-3.4-.8-5.034L115.7 24.9c-1.1-3.3-3.7-5.9-7-7L68.967 2.467c-1.567-.534-3.267-.8-4.967-.8z"/>
                  <path fill="#fff" d="M64 11.5c-.9 0-1.767.133-2.6.4l-36.5 14.167c-1.667.566-3 1.866-3.567 3.566L7.167 66.133c-.267.834-.4 1.7-.4 2.534 0 .866.133 1.7.4 2.566l14.166 36.5c.567 1.667 1.9 3 3.567 3.567l36.5 14.133c.833.267 1.7.4 2.567.4.866 0 1.733-.133 2.566-.4l36.5-14.133c1.667-.567 3-1.9 3.567-3.567l14.133-36.5c.267-.866.4-1.7.4-2.566 0-.834-.133-1.7-.4-2.534L106.067 29.6c-.567-1.7-1.9-3-3.567-3.566L66.033 11.9c-.8-.267-1.666-.4-2.033-.4z"/>
                  <path fill="#326ce5" d="M64 24.333c-1.4 0-2.767.2-4.1.6l-28.367 11c-2.6.867-4.633 2.934-5.5 5.534l-11 28.366c-.4 1.334-.6 2.7-.6 4.1 0 1.367.2 2.767.6 4.1l11 28.367c.867 2.6 2.9 4.633 5.5 5.5l28.367 11c1.333.4 2.7.6 4.1.6 1.4 0 2.767-.2 4.1-.6l28.367-11c2.6-.867 4.633-2.9 5.5-5.5l11-28.367c.4-1.333.6-2.733.6-4.1 0-1.4-.2-2.766-.6-4.1l-11-28.366c-.867-2.6-2.9-4.667-5.5-5.534l-28.367-11c-1.333-.4-2.7-.6-4.1-.6zm0 9.034l.967.033 25.4 9.867c1.433.466 2.566 1.6 3.033 3.033l9.867 25.4.033.967v.966l-.033.967-9.867 25.4c-.467 1.433-1.6 2.567-3.033 3.033l-25.4 9.867-.967.033-.967-.033-25.4-9.867c-1.433-.466-2.566-1.6-3.033-3.033l-9.867-25.4-.033-.967v-.966l.033-.967 9.867-25.4c.467-1.433 1.6-2.567 3.033-3.033l25.4-9.867.967-.033z"/>
                  <circle cx="64" cy="68.667" r="13.333" fill="#326ce5"/>
                </svg>
              </div>
              <div class="node-title">Kubernetes Control Plane</div>
              <div class="node-subtitle">v1.34.0 • 3 Node HA Cluster</div>
              <div class="nodes-row" style="margin-top: 20px;">
                <div class="node node-small mac-node">
                  <div class="node-icon">
                    <svg viewBox="0 0 24 24" fill="#67e8f9">
                      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                    </svg>
                  </div>
                  <div class="node-title">mac-mini-1</div>
                  <div class="node-subtitle">Talos 1.11.2</div>
                </div>
                <div class="node node-small mac-node">
                  <div class="node-icon">
                    <svg viewBox="0 0 24 24" fill="#67e8f9">
                      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                    </svg>
                  </div>
                  <div class="node-title">mac-mini-2</div>
                  <div class="node-subtitle">Talos 1.11.2</div>
                </div>
                <div class="node node-small mac-node">
                  <div class="node-icon">
                    <svg viewBox="0 0 24 24" fill="#67e8f9">
                      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                    </svg>
                  </div>
                  <div class="node-title">mac-mini-3</div>
                  <div class="node-subtitle">Talos 1.11.2</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Layer 4: Namespaces -->
          <div class="layer" data-layer="4" style="margin-top: 40px;">
            <div class="node node-small">
              <div class="node-icon">
                <svg viewBox="0 0 24 24" fill="#a78bfa">
                  <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
              </div>
              <div class="node-title">mirai</div>
              <div class="node-subtitle">Frontend App</div>
            </div>
            <div class="node node-small">
              <div class="node-icon">
                <svg viewBox="0 0 24 24" fill="#34d399">
                  <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
                </svg>
              </div>
              <div class="node-title">static-sites</div>
              <div class="node-subtitle">This Page!</div>
            </div>
            <div class="node node-small">
              <div class="node-icon">
                <svg viewBox="0 0 24 24" fill="#fb923c">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
              </div>
              <div class="node-title">argocd</div>
              <div class="node-subtitle">GitOps CD</div>
            </div>
            <div class="node node-small">
              <div class="node-icon">
                <svg viewBox="0 0 24 24" fill="#f472b6">
                  <path d="M19.5 12c0-.23-.01-.45-.03-.68l1.86-1.41c.4-.3.51-.86.26-1.3l-1.87-3.23c-.25-.44-.79-.62-1.25-.42l-2.15.91c-.37-.26-.76-.49-1.17-.68l-.29-2.31c-.06-.5-.49-.88-.99-.88h-3.73c-.51 0-.94.38-1 .88l-.29 2.31c-.41.19-.8.42-1.17.68l-2.15-.91c-.46-.2-1-.02-1.25.42L2.41 8.62c-.25.44-.14.99.26 1.3l1.86 1.41c-.02.22-.03.44-.03.67s.01.45.03.68l-1.86 1.41c-.4.3-.51.86-.26 1.3l1.87 3.23c.25.44.79.62 1.25.42l2.15-.91c.37.26.76.49 1.17.68l.29 2.31c.06.5.49.88.99.88h3.73c.5 0 .93-.38.99-.88l.29-2.31c.41-.19.8-.42 1.17-.68l2.15.91c.46.2 1 .02 1.25-.42l1.87-3.23c.25-.44.14-.99-.26-1.3l-1.86-1.41c.02-.22.03-.44.03-.67zm-7.5 3.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
              </div>
              <div class="node-title">monitoring</div>
              <div class="node-subtitle">Prometheus + Grafana</div>
            </div>
            <div class="node node-small">
              <div class="node-icon">
                <svg viewBox="0 0 24 24" fill="#ef4444">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
              </div>
              <div class="node-title">redis</div>
              <div class="node-subtitle">Cache Layer</div>
            </div>
          </div>
        </div>

        <div class="footer">
          Powered by Talos Linux • Managed with ArgoCD • Secured by Cloudflare
        </div>
      </div>

      <script>
        document.addEventListener('DOMContentLoaded', function() {
          // Animate title
          anime({
            targets: '.title',
            opacity: [0, 1],
            translateY: [-30, 0],
            duration: 1000,
            easing: 'easeOutExpo'
          });

          // Animate subtitle
          anime({
            targets: '.subtitle',
            opacity: [0, 1],
            duration: 800,
            delay: 300,
            easing: 'easeOutExpo'
          });

          // Animate layers sequentially
          anime({
            targets: '.layer',
            opacity: [0, 1],
            translateY: [30, 0],
            duration: 800,
            delay: anime.stagger(200, {start: 500}),
            easing: 'easeOutExpo'
          });

          // Animate connectors
          anime({
            targets: '.connector',
            opacity: [0, 0.6],
            scaleY: [0, 1],
            duration: 600,
            delay: anime.stagger(150, {start: 800}),
            easing: 'easeOutExpo'
          });

          // Animate footer
          anime({
            targets: '.footer',
            opacity: [0, 1],
            duration: 800,
            delay: 2000,
            easing: 'easeOutExpo'
          });

          // Interactive click effects
          document.querySelectorAll('.node').forEach(node => {
            node.addEventListener('click', function() {
              anime({
                targets: this,
                scale: [1, 0.95, 1.05, 1],
                duration: 400,
                easing: 'easeInOutQuad'
              });
            });
          });
        });
      </script>
    </body>
    </html>
