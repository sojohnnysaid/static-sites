apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-html
  namespace: static-sites
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Hello Kubernetes</title>
      <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: 'Courier New', monospace;
          background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 20px;
          position: relative;
          overflow: hidden;
        }
        body::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
          background-size: 50px 50px;
          pointer-events: none;
        }
        .title {
          color: #e8f4fc;
          font-size: 2.5rem;
          font-weight: bold;
          letter-spacing: 0.3em;
          text-transform: uppercase;
          margin-bottom: 10px;
          text-shadow: 0 0 20px rgba(100,180,255,0.5);
        }
        .subtitle {
          color: #6bb8e8;
          font-size: 0.9rem;
          letter-spacing: 0.2em;
          margin-bottom: 30px;
          opacity: 0.8;
        }
        .blueprint {
          background: rgba(10, 30, 60, 0.8);
          border: 2px solid #4a9eda;
          border-radius: 4px;
          padding: 30px;
          position: relative;
          box-shadow:
            0 0 30px rgba(74,158,218,0.2),
            inset 0 0 60px rgba(74,158,218,0.05);
        }
        .blueprint::before {
          content: 'HOMELAB CLUSTER v1.34.0';
          position: absolute;
          top: -12px;
          left: 20px;
          background: #0a1628;
          padding: 0 10px;
          color: #4a9eda;
          font-size: 0.7rem;
          letter-spacing: 0.1em;
        }
        .corner {
          position: absolute;
          width: 20px;
          height: 20px;
          border-color: #6bb8e8;
          border-style: solid;
        }
        .corner-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
        .corner-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
        .ascii {
          color: #e8f4fc;
          font-size: 11px;
          line-height: 1.4;
          white-space: pre;
          text-shadow: 0 0 10px rgba(100,180,255,0.3);
        }
        .node { opacity: 0; }
        .highlight { color: #6bb8e8; }
        .accent { color: #4ecdc4; }
        .dim { color: #4a6a8a; }
        .footer {
          margin-top: 30px;
          color: #4a6a8a;
          font-size: 0.7rem;
          letter-spacing: 0.15em;
        }
        .pulse {
          animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
      </style>
    </head>
    <body>
      <div class="title">Hello Kubernetes</div>
      <div class="subtitle">Talos Linux Homelab Cluster</div>
      <div class="blueprint">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <pre class="ascii"><span class="dim">┌─────────────────────────────────────────────────────────────────┐</span>
    <span class="dim">│</span>                    <span class="highlight">☁ CLOUDFLARE TUNNEL</span>                        <span class="dim">│</span>
    <span class="dim">│</span>        <span class="dim">hello.sogos.io  mirai.sogos.io  grafana.sogos.io</span>      <span class="dim">│</span>
    <span class="dim">└───────────────────────────┬─────────────────────────────────────┘</span>
                                <span class="dim">│</span>
    <span class="dim">┌───────────────────────────┴─────────────────────────────────────┐</span>
    <span class="dim">│</span>                      <span class="accent">INGRESS NAMESPACE</span>                         <span class="dim">│</span>
    <span class="dim">│</span>                     <span class="dim">┌───────────────┐</span>                          <span class="dim">│</span>
    <span class="dim">│</span>                     <span class="dim">│</span>  <span class="highlight">cloudflared</span>  <span class="dim">│</span>                          <span class="dim">│</span>
    <span class="dim">│</span>                     <span class="dim">└───────┬───────┘</span>                          <span class="dim">│</span>
    <span class="dim">└───────────────────────────┼─────────────────────────────────────┘</span>
                                <span class="dim">│</span>
    <span class="dim">════════════════════════════╪═════════════════════════════════════</span>
                                <span class="dim">│</span>
    <span class="node">┌───────────────────────────┴─────────────────────────────────────┐</span>
    <span class="node">│</span>                 <span class="highlight">⎈ KUBERNETES CONTROL PLANE</span>                     <span class="node">│</span>
    <span class="node">│                                                                 │</span>
    <span class="node">│   ┌─────────────┐   ┌─────────────┐   ┌─────────────┐          │</span>
    <span class="node">│   │</span> <span class="accent">mac-mini-1</span>  <span class="node">│   │</span> <span class="accent">mac-mini-2</span>  <span class="node">│   │</span> <span class="accent">mac-mini-3</span>  <span class="node">│          │</span>
    <span class="node">│   │</span><span class="dim">.223</span>         <span class="node">│   │</span><span class="dim">.162</span>         <span class="node">│   │</span><span class="dim">.215</span>         <span class="node">│          │</span>
    <span class="node">│   │</span> <span class="dim">Talos 1.11</span>  <span class="node">│   │</span> <span class="dim">Talos 1.11</span>  <span class="node">│   │</span> <span class="dim">Talos 1.11</span>  <span class="node">│          │</span>
    <span class="node">│   └─────────────┘   └─────────────┘   └─────────────┘          │</span>
    <span class="node">└─────────────────────────────────────────────────────────────────┘</span>
                                <span class="dim">│</span>
    <span class="dim">┌───────────────────────────┴─────────────────────────────────────┐</span>
    <span class="dim">│</span>                        <span class="accent">NAMESPACES</span>                               <span class="dim">│</span>
    <span class="dim">│  ┌──────────┐ ┌──────────┐ ┌──────────┐ ┌──────────┐           │</span>
    <span class="dim">│  │</span>  <span class="highlight">mirai</span>   <span class="dim">│ │</span><span class="highlight">static-</span>   <span class="dim">│ │</span> <span class="highlight">argocd</span>   <span class="dim">│ │</span><span class="highlight">monitoring</span><span class="dim">│           │</span>
    <span class="dim">│  │</span> <span class="dim">frontend</span> <span class="dim">│ │</span><span class="highlight">sites</span>     <span class="dim">│ │</span> <span class="dim">gitops</span>   <span class="dim">│ │</span><span class="dim">prometheus</span><span class="dim">│           │</span>
    <span class="dim">│  └──────────┘ └──────────┘ └──────────┘ └──────────┘           │</span>
    <span class="dim">└─────────────────────────────────────────────────────────────────┘</span></pre>
      </div>
      <div class="footer pulse">RUNNING ON TALOS LINUX • 3 NODE HA CLUSTER</div>
      <script>
        const { animate } = anime;
        animate('.title', {
          opacity: [0, 1],
          translateY: [-20, 0],
          duration: 800,
          easing: 'easeOutExpo'
        });
        animate('.subtitle', {
          opacity: [0, 0.8],
          duration: 800,
          delay: 200,
          easing: 'easeOutExpo'
        });
        animate('.blueprint', {
          opacity: [0, 1],
          scale: [0.95, 1],
          duration: 600,
          delay: 400,
          easing: 'easeOutExpo'
        });
        animate('.node', {
          opacity: [0, 1],
          duration: 400,
          delay: anime.stagger(100, {start: 800}),
          easing: 'easeOutExpo'
        });
        animate('.footer', {
          opacity: [0, 0.6],
          duration: 800,
          delay: 1500,
          easing: 'easeOutExpo'
        });
      </script>
    </body>
    </html>
